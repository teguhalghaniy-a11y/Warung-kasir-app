name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ADMOB_APP_ID: "ca-app-pub-3840341044949691~7329993273"
    steps:
      - name: Ambil Kode Proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan Java 17 untuk Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instal Capacitor & Salin File Web
        run: |
          npm install
          npm run prepare-web

      - name: Buat Proyek Android, Izin Kamera & AdMob App ID
        run: |
          npx cap add android
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i "s/<\/application>/    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"\/>\n    <\/application>/" android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compile File APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Warung-Kasir-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
